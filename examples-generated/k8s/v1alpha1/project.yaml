apiVersion: k8s.contrib.crossplane.io/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: k8s/v1alpha1/project
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    containerResourceLimit:
    - limitsCpu: 20m
      limitsMemory: 20Mi
      requestsCpu: 1m
      requestsMemory: 1Mi
    name: foo
    resourceQuota:
    - namespaceDefaultLimit:
      - limitsCpu: 2000m
        limitsMemory: 500Mi
        requestsStorage: 1Gi
      projectLimit:
      - limitsCpu: 2000m
        limitsMemory: 2000Mi
        requestsStorage: 2Gi
